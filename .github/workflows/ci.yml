name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    name: Validate list, links, and markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run lint

      - name: Validate list structure
        run: npm run test:list

      - name: Run tests and link check
        run: npm test